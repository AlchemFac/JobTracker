<!DOCTYPE html>
<html lang="en"
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Job Tracker</h1>

    <form id="jobForm">

      <input
        type="text"
        id="company"
        placeholder="Company Name"
        required
      >

      <input
        type="text"
        id="role"
        placeholder="Job Role"
        required
      >

      <input
        type="date"
        id="dateApplied"
      >

      <select id="status">
        <option>Applied</option>
        <option>Interview</option>
        <option>Rejected</option>
        <option>Offer</option>
      </select>

      <textarea
        id="notes"
        placeholder="Notes"
      ></textarea>

      <button  id="submitButton" type="submit">
        Add Job
      </button>

    </form>

<section id="statsSection">
  <h2>Application Stats</h2>

  <p>Total Applications: <span id="totalJobs">0</span></p>
  <p>Applied: <span id="appliedJobs">0</span></p>
  <p>Interviews: <span id="interviewJobs">0</span></p>
  <p>Rejected: <span id="rejectedJobs">0</span></p>
  <p>Offers: <span id="offerJobs">0</span></p>
</section>

<input
  type="text"
  id="searchInput"
  placeholder="Search company or role..."
    >

    <select id="filterStatus">
      <option value="All">All</option>
      <option value="Applied">Applied</option>
      <option value="Interview">Interview</option>
      <option value="Rejected">Rejected</option>
      <option value="Offer">Offer</option>
    </select>

    <section class="ai-section">
  <h2>Analyze Job Description</h2>

  <textarea
    id="jobDescriptionInput"
    placeholder="Paste job description here..."
  ></textarea>

  <button id="analyzeJobButton" type="button">
    Analyze Job
  </button>

  <button id="clearAnalysisButton" type="button">
  Clear
  </button>

  <button id="saveAnalysisButton" type="button">
    Save Analysis to Job
  </button>

  <div id="aiAnalysisResult"></div>
</section>

<section class="ai-section">
  <h2>Resume Match Analyzer</h2>

  <textarea
  id="resumeInput"
  placeholder="Paste your resume here..."
  ></textarea>

  <textarea
  id="resumeJobDescriptionInput"
  placeholder="Paste the job description here..."
  ></textarea>

  <button id="compareResumeButton" type="button">
    Compare Resume
  </button>

  <button id="clearResumeCompareButton" type="button">
    Clear Resume Comparison
  </button>

  <div id="resumeCompareResult"></div>
</section>

    <div id="jobList">

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
